# Backup keep-alive if Vercel Cron is delayed — pings production every 3 days
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${KEEP_ALIVE_URL:-https://unsttopableteam.vercel.app/api/keep-alive}"
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$URL"
          else
            curl -fsS "$URL"
          fi
          echo ""
          echo "Keep-alive OK"
